    <script>
      // Gracefully handle Vite HMR WebSockets in sandbox environments where WebSockets are not forwarded
      if (typeof window !== 'undefined' && window.WebSocket) {
        const OrigWS = window.WebSocket;
        window.WebSocket = function (url, protocols) {
          if (protocols === 'vite-hmr' || (typeof url === 'string' && (url.includes('token=') || url.includes('vite')))) {
            const listeners = {};
            const mockWS = {
              OPEN: 1,
              CLOSED: 3,
              CLOSING: 2,
              CONNECTING: 0,
              readyState: 1,
              addEventListener: (type, cb) => {
                listeners[type] = listeners[type] || [];
                listeners[type].push(cb);
                if (type === 'open') setTimeout(() => cb({ type: 'open' }), 0);
              },
              removeEventListener: (type, cb) => {
                if (listeners[type]) listeners[type] = listeners[type].filter(f => f !== cb);
              },
              dispatchEvent: () => true,
              send: () => {},
              close: () => {
                mockWS.readyState = 3;
                if (listeners['close']) listeners['close'].forEach(f => f({ type: 'close', wasClean: true }));
              },
            };
            return mockWS;
          }
          return new OrigWS(url, protocols);
        };
        window.WebSocket.prototype = OrigWS.prototype;
        window.WebSocket.OPEN = OrigWS.OPEN;
        window.WebSocket.CLOSED = OrigWS.CLOSED;
        window.WebSocket.CLOSING = OrigWS.CLOSING;
        window.WebSocket.CONNECTING = OrigWS.CONNECTING;

        window.addEventListener('unhandledrejection', (e) => {
          if (e.reason && ((e.reason.message && e.reason.message.includes('WebSocket')) || String(e.reason).includes('WebSocket'))) {
            e.preventDefault();
          }
        });
      }
    </script>
